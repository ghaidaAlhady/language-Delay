services:
  - type: web
    name: smart-guide-language-delay-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    # Render's free plan does not support a separate pre-deploy command, so
    # migrations run before the single free web process starts.
    startCommand: cd backend && python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: KNOWLEDGE_BASE_DIR
        value: ../knowledge_base
      - key: GEMINI_ENABLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
      - key: GEMINI_MAX_RETRIES
        value: "1"
      - key: GEMINI_PROMPT_VERSION
        value: v1
      - key: GOOGLE_CLIENT_ID
        sync: false
